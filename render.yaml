services:
  - type: web
    name: berry-dashboard
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: BERRY_SESSION_SECRET
        generateValue: true
      # Set these in the Render dashboard; never commit real passwords.
      - key: BERRY_ADMIN_PASSWORD
        sync: false
      - key: BERRY_AGENT_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /tmp/berry-data
